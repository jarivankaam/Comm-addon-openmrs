server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: azaricomm-communication-service
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/openmrs}

rabbitmq:
  exchange: azaricomm.events
  queue: azaricomm.notifications
  routing-key: "notification.#"

crypto:
  secret-key: ${CRYPTO_SECRET_KEY:abcdefghijklmnopqrstuvwxyz123456}

providers:
  swiftsend:
    url: ${PROVIDER_SWIFTSEND_URL:https://httpbin.org/post}
    api-key: ${PROVIDER_SWIFTSEND_API_KEY:mock-key-123}
  legacylink:
    url: ${PROVIDER_LEGACYLINK_URL:http://localhost:8099/mock/legacylink}
    api-key: ${PROVIDER_LEGACYLINK_API_KEY:mock-key-123}
  securepost:
    url: ${PROVIDER_SECUREPOST_URL:http://localhost:8099/mock/securepost}
    api-key: ${PROVIDER_SECUREPOST_API_KEY:mock-key-123}
  asyncflow:
    url: ${PROVIDER_ASYNCFLOW_URL:http://localhost:8099/mock/asyncflow}
    api-key: ${PROVIDER_ASYNCFLOW_API_KEY:mock-key-123}

logging:
  level:
    com.azaricomm: DEBUG