version: "3.8"
services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: azaricomm-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7
    container_name: azaricomm-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  communication-service:
    build:
      context: ./communication-service
    container_name: azaricomm-communication-service
    ports:
      - "8081:8081"
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
    depends_on:
      rabbitmq:
        condition: service_healthy

  scheduler:
    build:
      context: ./scheduler
    container_name: azaricomm-scheduler
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_started

  notifworker:
    build:
      context: ./notifworker
    container_name: azaricomm-notifworker
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_started

volumes:
  mongodb_data: