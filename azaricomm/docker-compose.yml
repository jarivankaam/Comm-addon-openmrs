version: "3.8"
services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: azaricomm-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7
    container_name: azaricomm-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
    container_name: azaricomm-api
    ports:
      - "8080:8080"
    environment:
      MONGODB_URI: mongodb://mongodb:27017/azaricomm
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      OPENMRS_BASE_URL: ${OPENMRS_BASE_URL:-http://localhost:8081}
      OPENMRS_USERNAME: ${OPENMRS_USERNAME:-admin}
      OPENMRS_PASSWORD: ${OPENMRS_PASSWORD:-Admin123}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_healthy

  communication-service:
    build:
      context: ./communication-service
    container_name: azaricomm-communication-service
    ports:
      - "8081:8081"
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
    depends_on:
      rabbitmq:
        condition: service_healthy

  scheduler:
    build:
      context: ./scheduler
    container_name: azaricomm-scheduler
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_started

  notifworker:
    build:
      context: ./notifworker
    container_name: azaricomm-notifworker
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_started

volumes:
  mongodb_data:
