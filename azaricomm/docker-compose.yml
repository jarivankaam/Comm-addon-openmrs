services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: azaricomm-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
      - "15692:15692"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_PLUGINS: "rabbitmq_management rabbitmq_prometheus"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7
    container_name: azaricomm-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
    container_name: azaricomm-api
    ports:
      - "8080:8080"
    environment:
      MONGODB_URI: mongodb://mongodb:27017/azaricomm
      CRYPTO_SECRET_KEY: ${CRYPTO_SECRET_KEY:-DitIsMijnSuperGeheimeSleutel123!}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      OPENMRS_BASE_URL: ${OPENMRS_BASE_URL:-http://localhost:8081}
      OPENMRS_USERNAME: ${OPENMRS_USERNAME:-admin}
      OPENMRS_PASSWORD: ${OPENMRS_PASSWORD:-Admin123}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      OTEL_SERVICE_NAME: azaricomm-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_METRICS_EXPORTER: otlp
      OTEL_TRACES_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: none
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_healthy

  scheduler:
    build:
      context: ./scheduler
    container_name: azaricomm-scheduler
    environment:
      MONGODB_URI: mongodb://mongodb:27017/azaricomm
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_EXCHANGE: azaricomm.events
      OTEL_SERVICE_NAME: azaricomm-scheduler
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_METRICS_EXPORTER: otlp
      OTEL_TRACES_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: none
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_healthy

  notifworker:
    build:
      context: ./notifworker
    container_name: azaricomm-notifworker
    environment:
      MONGODB_URI: mongodb://mongodb:27017/azaricomm
      CRYPTO_SECRET_KEY: ${CRYPTO_SECRET_KEY:-DitIsMijnSuperGeheimeSleutel123!}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      PROVIDER_SWIFTSEND_URL: ${PROVIDER_SWIFTSEND_URL:-https://httpbin.org/post}
      PROVIDER_SWIFTSEND_API_KEY: ${PROVIDER_SWIFTSEND_API_KEY:-}
      PROVIDER_LEGACYLINK_URL: ${PROVIDER_LEGACYLINK_URL:-https://httpbin.org/post}
      PROVIDER_LEGACYLINK_API_KEY: ${PROVIDER_LEGACYLINK_API_KEY:-}
      PROVIDER_SECUREPOST_URL: ${PROVIDER_SECUREPOST_URL:-https://httpbin.org/post}
      PROVIDER_SECUREPOST_API_KEY: ${PROVIDER_SECUREPOST_API_KEY:-}
      PROVIDER_ASYNCFLOW_URL: ${PROVIDER_ASYNCFLOW_URL:-https://httpbin.org/post}
      PROVIDER_ASYNCFLOW_API_KEY: ${PROVIDER_ASYNCFLOW_API_KEY:-}
      OTEL_SERVICE_NAME: azaricomm-notifworker
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_METRICS_EXPORTER: otlp
      OTEL_TRACES_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: none
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_healthy

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: azaricomm-otel-collector
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    volumes:
      - ./config/monitoring/otel-collector-config.yml:/etc/otelcol-contrib/config.yaml

  prometheus:
    image: prom/prometheus:latest
    container_name: azaricomm-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    depends_on:
      - otel-collector

  grafana:
    image: grafana/grafana:latest
    container_name: azaricomm-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./config/monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus

volumes:
  mongodb_data:
  prometheus-data:
  grafana-data:
