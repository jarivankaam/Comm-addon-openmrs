server:
  port: ${SERVER_PORT:8443}
  ssl:
    enabled: true
    key-store: ${SSL_KEY_STORE:classpath:keystore.p12}
    key-store-password: ${SSL_KEY_STORE_PASSWORD:changeit}
    key-store-type: PKCS12
    enabled-protocols: TLSv1.3
    ciphers: TLS_AES_128_GCM_SHA256,TLS_AES_256_GCM_SHA384,TLS_CHACHA20_POLY1305_SHA256

spring:
  application:
    name: azaricomm-api
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/openmrs}

webhook:
  secret: ${WEBHOOK_SECRET:}

openmrs:
  base-url: ${OPENMRS_BASE_URL:http://localhost:8081}
  username: ${OPENMRS_USERNAME:admin}
  password: ${OPENMRS_PASSWORD:Admin123}

crypto:
  secret-key: ${CRYPTO_SECRET_KEY}

logging:
  level:
    com.azaricomm: DEBUG
